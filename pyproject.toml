[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vid2gif"
dynamic = ["version"]
description = "Convertit une vidéo (fichier ou lien X, YouTube…) en GIF, depuis le Finder ou la ligne de commande."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/jbsaintebeuve/video-to-gif"

[project.scripts]
vid2gif = "vid2gif.cli:entry"

[tool.setuptools]
packages = ["vid2gif"]

[tool.setuptools.dynamic]
version = { attr = "vid2gif.__version__" }

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# UP031/UP032 : on garde le formatage % pour rester lisible ; S603/S607 : subprocess
# est appelé sans shell, avec des listes d'arguments (revu, voir SECURITY.md).
ignore = ["UP031", "UP032", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# B404/B603/B607 : subprocess est utilisé volontairement, sans shell et avec des
# listes d'arguments ; les outils (ffmpeg, yt-dlp…) sont résolus via le PATH.
skips = ["B404", "B603", "B607"]
